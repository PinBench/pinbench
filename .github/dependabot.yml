version: 2

updates:
  # Workflow actions are pinned to commit SHAs (see .github/workflows/ci.yml),
  # which is the point — a mutable tag lets whoever controls the action change
  # what runs in a job holding a repository secret. Pinning only helps if
  # something still moves the pins, so Dependabot does it and updates the
  # trailing `# vX.Y.Z` comment alongside the SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # pub is deliberately absent: Flutter/Dart constraints here are tightly
  # interlocked (firebase_*, riverpod codegen, the pinned dartastic beta), and
  # Dependabot cannot run build_runner to check a bump actually compiles.
  # Those move by hand with `flutter pub outdated`.
