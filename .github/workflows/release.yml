name: Release

# Builds the desktop app for macOS, Windows and Linux and makes a release of
# them: a .dmg, the Inno Setup installer (windows/packaging/installer.iss) and
# a .tar.gz, with SHA256SUMS.txt and the files the app's updater reads
# (appcast-macos.xml, appcast-windows.xml and latest.json, written by
# tools/release_metadata.dart). The download page lists the newest release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# A tag makes a *draft* release: look it over, then publish it, which is when
# the updater and the download page see it. A pull request that changes this
# file, the installer or the metadata tool builds everything without
# releasing, which is how a change here is tested.
#
# Not signed yet: there is no Apple Developer ID or Windows certificate. Until
# there is, the macOS app is signed ad hoc, so macOS asks to confirm opening it
# (right-click, Open), and Windows shows a SmartScreen prompt for the installer.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - windows/packaging/**
      - windows/runner/Runner.rc
      - macos/Runner/Info.plist
      - tools/release_metadata.dart

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A trial needs the signing keys, which a pull request from a fork or
  # Dependabot does not get, and a macOS build is the dearest minute there is.
  version:
    name: Version
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      number: ${{ steps.v.outputs.number }}
    steps:
      - uses: actions/checkout@v7
      # A tag v1.2.3 is version 1.2.3 with build number 10203, which only ever
      # grows from one release to the next: Sparkle compares build numbers. A
      # pull request's trial build takes pubspec.yaml's version.
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)"
          fi
          IFS=. read -r major minor patch <<< "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "number=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            target: macOS
          - os: windows-latest
            platform: windows
            target: Windows
          - os: ubuntu-latest
            platform: linux
            target: Linux
    env:
      VERSION: ${{ needs.version.outputs.name }}
      BUILD_NUMBER: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libblkid-dev libasound2-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - run: flutter config --enable-${{ matrix.platform }}-desktop
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build
        shell: bash
        # Flutter hands FLUTTER_XCODE_* to xcodebuild as build settings; plain
        # CODE_SIGNING_* variables never reach it, and the Release target's
        # automatic signing then wants a provisioning profile CI cannot have.
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: ""
        run: flutter build ${{ matrix.platform }} --release --build-name "$VERSION" --build-number "$BUILD_NUMBER"

      # Apple silicon will not run an unsigned app, so until there is a
      # Developer ID it is signed ad hoc, with the release entitlements less
      # keychain-access-groups: that one needs a provisioning profile, and an
      # app claiming it without one is killed at launch. (It serves the pro
      # edition's sign-in, which this build does not include.) Then it is
      # started, to prove macOS lets it run.
      - name: Sign ad hoc, and launch (macOS)
        if: matrix.platform == 'macos'
        run: |
          app=build/macos/Build/Products/Release/pinbench.app
          cp macos/Runner/Release.entitlements "$RUNNER_TEMP/adhoc.entitlements"
          plutil -remove keychain-access-groups "$RUNNER_TEMP/adhoc.entitlements"
          codesign --force --deep --sign - --entitlements "$RUNNER_TEMP/adhoc.entitlements" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/MacOS/pinbench" & pid=$!
          sleep 15
          kill -0 "$pid" || { echo "::error::the app exited within 15 s of launch"; exit 1; }
          kill "$pid"

      - name: Package (macOS disk image)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          hdiutil create -volname PinBench -srcfolder build/macos/Build/Products/Release/pinbench.app \
            -ov -format UDZO "dist/pinbench-$VERSION-macos.dmg"

      - name: Package (Windows installer)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:VERSION" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\build\windows\x64\runner\Release" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" `
            windows\packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # What a user does with it: install (per user, silently), start the app
      # and see it stay up, then uninstall and see it gone.
      - name: Install, launch and uninstall (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-windows-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\PinBench'
          $exe = Join-Path $dir 'pinbench.exe'
          if (-not (Test-Path $exe)) { Write-Error "the installer did not put pinbench.exe in $dir"; exit 1 }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { Write-Error "the installed app exited within 15 s (code $($app.ExitCode))"; exit 1 }
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 2
          Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { Write-Error 'the uninstaller left pinbench.exe behind'; exit 1 }

      - name: Package (Linux tarball)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          tar -czf "dist/pinbench-$VERSION-linux.tar.gz" -C build/linux/x64/release/bundle .

      # Unpacked from the tarball as a user would, and started on a virtual
      # display (Mesa's software GL stands in for a GPU) to see it stay up.
      - name: Launch from the tarball (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri
          mkdir -p "$RUNNER_TEMP/app"
          tar -xzf "dist/pinbench-$VERSION-linux.tar.gz" -C "$RUNNER_TEMP/app"
          xvfb-run -a "$RUNNER_TEMP/app/pinbench" > "$RUNNER_TEMP/app.log" 2>&1 & pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/app.log"
            echo "::error::the app exited within 15 s of launch"
            exit 1
          fi
          kill "$pid"

      - uses: actions/upload-artifact@v7
        with:
          name: pinbench-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: ${{ github.event_name == 'pull_request' && 'Assemble (trial, not released)' || 'Draft the release' }}
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.name }}
      BUILD_NUMBER: ${{ needs.version.outputs.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - run: git submodule update --init --recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The app installs an update only with a valid signature: Sparkle checks
      # the .dmg's Ed25519 one against Info.plist's SUPublicEDKey, WinSparkle
      # the installer's DSA one against Runner.rc's DSAPub. Each signature is
      # verified here against those embedded keys, so a release signed with
      # the wrong key fails now instead of every user's next update.
      - name: Sign the updates
        env:
          ED_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DSA_KEY: ${{ secrets.WINSPARKLE_DSA_PRIVATE_KEY }}
        run: |
          if [ -z "$ED_KEY" ] || [ -z "$DSA_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY and WINSPARKLE_DSA_PRIVATE_KEY must be set: the app rejects unsigned updates"
            exit 1
          fi
          keys="$RUNNER_TEMP/keys" && mkdir -m 700 "$keys"
          printf '%s\n' "$ED_KEY" > "$keys/ed.pem"
          printf '%s\n' "$DSA_KEY" > "$keys/dsa.pem"
          dmg="dist/pinbench-$VERSION-macos.dmg"
          exe="dist/pinbench-$VERSION-windows-setup.exe"

          openssl pkeyutl -sign -inkey "$keys/ed.pem" -rawin -in "$dmg" -out "$keys/ed.sig"
          openssl dgst -sha1 -binary < "$exe" | openssl dgst -sha1 -sign "$keys/dsa.pem" -out "$keys/dsa.sig"

          # The app's public keys, as it carries them.
          ed_public=$(sed -n '/<key>SUPublicEDKey<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' macos/Runner/Info.plist)
          { printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'; printf '%s' "$ed_public" | base64 -d; } > "$keys/ed_public.der"
          openssl pkeyutl -verify -pubin -keyform DER -inkey "$keys/ed_public.der" -rawin -in "$dmg" -sigfile "$keys/ed.sig"
          openssl dgst -sha1 -binary < "$exe" | openssl dgst -sha1 -verify windows/runner/resources/winsparkle_dsa_public.pem -signature "$keys/dsa.sig"

          echo "ED_SIGNATURE=$(base64 -w0 < "$keys/ed.sig")" >> "$GITHUB_ENV"
          echo "DSA_SIGNATURE=$(base64 -w0 < "$keys/dsa.sig")" >> "$GITHUB_ENV"
          rm -rf "$keys"

      - name: Write the updater's files and the checksums
        run: |
          tag="v$VERSION"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          dart run tools/release_metadata.dart \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --base-url "$base" \
            --notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out dist \
            --asset "macos=dist/pinbench-$VERSION-macos.dmg" \
            --asset "windows=dist/pinbench-$VERSION-windows-setup.exe" \
            --asset "linux=dist/pinbench-$VERSION-linux.tar.gz" \
            --ed-signature "macos=$ED_SIGNATURE" \
            --dsa-signature "windows=$DSA_SIGNATURE"
          (cd dist && sha256sum pinbench-* > SHA256SUMS.txt)
          ls -la dist
          cat dist/SHA256SUMS.txt
          grep -q 'sparkle:edSignature=' dist/appcast-macos.xml
          grep -q 'sparkle:dsaSignature=' dist/appcast-windows.xml

      - name: Keep the trial's files
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-trial
          path: dist/*
          retention-days: 7

      - name: Draft the release
        if: github.event_name == 'push'
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --title "PinBench $VERSION" \
            --generate-notes \
            --notes "Desktop builds for macOS (Apple silicon and Intel), Windows and Linux. Not yet code-signed: on macOS, right-click the app and choose Open the first time; on Windows, the installer shows a SmartScreen prompt."
