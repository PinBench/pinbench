name: CI

on:
  push:
    # Not tags: a tag names a commit that already passed this workflow when it
    # landed on main, and nothing waits on a second run. release.yml builds
    # the tag. (Was: tags ["v*"], a full rerun of an unchanged commit.)
    branches: [main]
    paths-ignore:
      # Prose changes nothing this workflow checks.
      - "**.md"
      - docs/**
      - LICENSE
      - NOTICE
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE
      - NOTICE
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least privilege by default. GITHUB_TOKEN is handed to every action in the
# run, including third-party ones, so it should carry no more than reading the
# checkout. Jobs that need more opt in for themselves.
permissions:
  contents: read

# Laid out for wall-clock time, not runner minutes. The repository is public,
# and GitHub-hosted runners are free for public repositories, so the checks run
# side by side — analysis, the app's tests in shards, each package, the web
# build — rather than one after another in a single job, which took ~10 min
# before the web build could even start. The earlier layout was shaped by a
# private plan's minute allowance, which ran out.
#
# Every app job starts with .github/actions/setup-app: submodules, Flutter
# from .fvmrc (one file, which fvm reads locally too), dependencies and the
# generated code, cached.

jobs:
  # Lints and formatting, apart from the tests so neither waits on the other.
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-app
        with:
          enforce-lockfile: "true"

      # `dart analyze --fatal-infos`, not `flutter analyze`.
      #
      # `flutter analyze` does not load the analyzer plugins
      # `analysis_options.yaml` registers *at all*, so every riverpod_lint rule
      # was inert here, and 34 findings accumulated behind a green step. They
      # were only ever visible in an IDE.
      #
      # `--fatal-infos` because the two commands disagree on what failure
      # means: `flutter analyze` exits non-zero on an info, plain
      # `dart analyze` exits 0. Most of what riverpod_lint reports is
      # info-level, so without the flag this step would have got weaker.
      #
      # The grep stays as redundancy: an unresolvable plugin exits 4 on its
      # own, where `flutter analyze` exited 0 with "No issues found". Verified
      # by pinning riverpod_lint to a nonexistent version — the message it
      # greps for is still the one printed.
      # The analyzer's own cache — summaries of the SDK, every dependency and
      # each library it has seen — kept between runs. Measured locally: 48 s
      # with it empty, 27 s warm, for 76 MB. Keyed on the sources so an exact
      # hit is this tree; a partial one still carries everything unchanged,
      # since entries are addressed by content.
      - name: Restore the analysis cache
        uses: actions/cache@v6
        with:
          path: .dart_tool/analysis-cache
          key: analysis-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'analysis_options.yaml', 'lib/**/*.dart', 'test/**/*.dart') }}
          restore-keys: analysis-${{ runner.os }}-

      - name: Analyze
        run: |
          set -o pipefail
          # Absolute: the analyzer resolves a relative --cache against its own
          # install for the plugin builds it keeps there, and riverpod_lint
          # then fails to load ("does not contain a valid AOT snapshot").
          dart analyze --fatal-infos --cache="$PWD/.dart_tool/analysis-cache" 2>&1 | tee analyze.log
          if grep -q "error occurred while executing an analyzer plugin" analyze.log; then
            echo "::error::An analyzer plugin failed to load — see the log above."
            exit 1
          fi

      # Check only files tracked in git. `lib/ test/` would also cover the
      # generated *.g.dart files — git-ignored build output, which build_runner
      # does not emit at the page_width:100 this project uses, so including them
      # fails CI over files that are not even in the repository.
      - name: Check formatting
        run: git ls-files -z -- 'lib/*.dart' 'test/*.dart' | xargs -0 dart format --output=none --set-exit-if-changed

  # The app's tests, in shards: the suite was ~4 min on its own in one job.
  #
  # Sharded by file, not with `flutter test --total-shards`. That splits the
  # *tests*: every shard still compiled all ~105 files, which is most of the
  # time, and then ran a third of them — each shard took ~3 min of the old
  # job's 4. Here each shard gets every third file and compiles only those.
  test:
    name: Test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-app

      # The 'arduino' tag covers tests that shell out to a local arduino-cli
      # toolchain, which isn't available on CI — they run locally instead.
      #
      # Coverage only for a push to main. It is read as a trend on main's runs,
      # and collecting it made the suite ~30% slower, so pull requests skip it.
      - name: Run tests
        env:
          COVERAGE: ${{ github.event_name == 'push' && '--coverage' || '' }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # Every third file, in a stable order. A file added tomorrow joins a
          # shard on its own.
          mapfile -t files < <(git ls-files -- 'test/*_test.dart' | awk -v n=3 -v i="$SHARD" 'NR % n == i % n')
          echo "Shard $SHARD/3: ${#files[@]} files"
          # shellcheck disable=SC2086 # COVERAGE is one flag or nothing.
          flutter test --exclude-tags arduino $COVERAGE "${files[@]}"

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  # The packages in packages/, each on its own runner.
  #
  # The root analysis_options excludes packages/**, and `flutter test` at the
  # root does not descend into them, so they are checked here on their own
  # terms — each carries its own analysis_options and pubspec. They used to run
  # one after another in the app's job (~2.5 min); the list comes from the
  # repository (`detect`), so a new package is covered the day it is added.
  package:
    name: Package ${{ matrix.package }}
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-app
        with:
          codegen: "false"

      # Each package resolves against its siblings' checkouts — the submodule
      # commits the app pins — not the git branches its pubspec names. Without
      # this, pinbench_parts and pinbench_sim were tested against pdl's main
      # while the app built the submodule, and a branch the app needed failed
      # here on APIs main did not have yet.
      - name: Link packages to their siblings
        run: tools/link_packages.sh

      - name: Analyze and test
        working-directory: packages/${{ matrix.package }}
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze --fatal-infos
          # Not every package has a suite — composite_plugin is a generated
          # analyzer plugin. `flutter test` exits 1 on "Test directory not
          # found", which is not a failure worth blocking on. Announced either
          # way, so a package that lost its tests shows up rather than quietly
          # passing.
          if [ -d test ]; then
            flutter test
          else
            echo "::notice::${{ matrix.package }} has no test/ directory — analysis only."
          fi

  # Proves the web target still compiles. Only proves it: this repository does
  # not publish the web app anywhere, so nothing here needs a deploy
  # configuration or its secrets. Alongside the checks, not after them: it
  # waited ~10 min for them only to borrow their generated code.
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # A pull request that touches only what the web build does not compile —
      # tests, the native runners, the git hooks — skips it. Checked here
      # rather than by `detect`, which would make every web build wait for that
      # job first, and the web build is CI's longest job. Anything else builds,
      # workflow changes included, since they can break this job itself; so do
      # pushes to main, which a web preview follows.
      - name: Does this change reach the web build?
        id: web
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          needed=true
          if [ "$EVENT" = pull_request ] && git fetch -q --no-tags --depth=1 origin "$BASE_SHA"; then
            if ! git diff --name-only "$BASE_SHA" HEAD \
                | grep -qvE '^(test/|\.githooks/|setup_hooks\.sh$|(macos|windows|linux|ios|android)/)'; then
              needed=false
              echo "::notice::Nothing this pull request changes is compiled by the web build — skipped."
            fi
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-app
        if: steps.web.outputs.needed == 'true'

      # --wasm because that is the configuration that ships; a dart2js-only
      # build would miss a WASM-specific compile failure.
      - name: Build (WASM)
        if: steps.web.outputs.needed == 'true'
        run: flutter build web --wasm --pwa-strategy=none

  # What the rest of the run needs to know about this push or pull request:
  # which packages to check, and whether it touches code only a desktop
  # toolchain compiles.
  #
  # `test` runs on the Dart VM and `build-web` runs dart2js, so neither ever
  # compiles the native runners. Without the desktop check, a typo in
  # win32_window.cpp or my_application.cc stays invisible until a release tag —
  # the one build you least want to discover it in.
  #
  # Written as a git diff rather than a paths-filter action: it is a dozen
  # lines, and the alternative is another third-party action holding the
  # workflow token. It also lints the workflows when one changed: actionlint
  # needs two seconds, not a job of its own.
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every directory under packages/, submodules included: read from the
      # tree, since a submodule's directory is empty until it is fetched.
      - id: packages
        run: |
          set -euo pipefail
          packages=$(git ls-tree -d --name-only HEAD packages/ | sed 's#^packages/##' | jq -R . | jq -cs .)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Packages: $packages"

      - id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          # The first line of a squash merge ends "(#123)".
          HEAD_SUBJECT: ${{ github.event.head_commit.message }}
          # release.yml's trial runs for its own paths on a same-repository
          # pull request (its `version` job's condition) and builds all three
          # platforms in release mode, so building them here too is a repeat.
          SAME_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        run: |
          set -euo pipefail

          # A new branch or a force-push leaves no usable base. Build rather
          # than guess: a wasted run is cheaper than an unverified runner.
          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit — building desktop to be safe."
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "workflows=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          # Indent the listing for readability. A read loop rather than
          # `sed 's/^/  /'`: shellcheck's SC2001 flags spawning sed for what
          # the shell does itself, and actionlint runs shellcheck over this.
          while IFS= read -r file; do
            [ -n "$file" ] && echo "  $file"
          done <<< "$changed"
          native=false
          if echo "$changed" | grep -qE '^(macos|windows|linux)/'; then
            native=true
            subject="${HEAD_SUBJECT%%$'\n'*}"
            if [ "$EVENT" = push ] && [[ "$subject" =~ \(#[0-9]+\)$ ]]; then
              # A merged pull request: it built the desktop apps before it
              # merged, and a tag's release builds them again.
              echo "Merged from a pull request that built desktop — not again."
              native=false
            elif [ "$SAME_REPO" = true ] && echo "$changed" | grep -qE '^(\.github/workflows/release\.yml|windows/packaging/|windows/runner/Runner\.rc|macos/Runner/Info\.plist|tools/release_metadata\.dart)'; then
              echo "::notice::The Release workflow's trial builds all three platforms for this change, so CI does not."
              native=false
            fi
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          if echo "$changed" | grep -qE '^\.github/(workflows|actions)/'; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflows=false" >> "$GITHUB_OUTPUT"
          fi

      # A malformed workflow fails the run in 0s with no usable error in the API —
      # `shell: ${{ matrix.shell }}` (expressions are not allowed there) cost a
      # push to discover. actionlint catches that class of mistake in ~2s.
      - name: actionlint
        if: steps.filter.outputs.workflows == 'true'
        run: |
          # Pinned, like every other tool version here. `latest` meant a
          # release of actionlint could turn this job red on a push that
          # changed nothing — 1.7.12 added a shellcheck rule and did exactly
          # that. Bump deliberately, and fix what the new version finds in
          # the same commit. Was: latest
          bash <(curl -sS https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12 .
          ./actionlint -color

  # Compiles any commit that edits a native runner, the only code no other job
  # compiles. Native code changes a couple of times a year.
  #
  # A debug build, because compiling the runner is the whole point: release
  # mode also compiles the Dart ahead of time — for two architectures on macOS,
  # ~10 of that job's 14 minutes — which proves nothing the web build and the
  # tests have not, and its output is not something to hand anyone. The
  # deliverables are release.yml's: built from the tag, signed, notarised and
  # packaged. So nothing is uploaded here.
  build-desktop:
    name: Build ${{ matrix.target }}
    needs: detect
    if: needs.detect.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            target: macOS
          - os: windows-latest
            platform: windows
            target: Windows
          - os: ubuntu-latest
            platform: linux
            target: Linux

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libblkid-dev libasound2-dev

      # Desktop targets are enabled by default on stable, so no `flutter config
      # --enable-*-desktop` (37 s on Windows). The SDK cache only on Linux: on
      # Windows saving it took 168 s and restoring 97 s.
      - uses: ./.github/actions/setup-app
        with:
          flutter-cache: ${{ matrix.platform == 'linux' }}

      # Flutter hands FLUTTER_XCODE_* to xcodebuild as build settings; plain
      # CODE_SIGNING_* variables never reach it, and automatic signing then
      # wants a provisioning profile CI cannot have.
      - name: Build Desktop App
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: ""
        run: flutter build ${{ matrix.platform }} --debug

  # Main's coverage figure, on the run's summary page. Each shard measured the
  # files its own tests load, so the same line can appear in several reports:
  # a line counts once, and as covered if any shard ran it. It counts only files
  # the tests load, so read it as a trend, not an absolute.
  coverage:
    name: Coverage
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
      - name: Summarise
        run: |
          set -euo pipefail
          cat coverage/*/lcov.info | awk -F'[:,]' '
            /^SF:/ { file = substr($0, 4) }
            /^DA:/ {
              key = file ":" $2
              if (!(key in seen)) { seen[key] = 1; total++ }
              if ($3 > 0 && !(key in hit)) { hit[key] = 1; covered++ }
            }
            END { if (total) printf "**Line coverage: %.1f%%** (%d of %d lines, in the files the tests load)\n", 100 * covered / total, covered, total }
          ' >> "$GITHUB_STEP_SUMMARY"

  # Asks PinBench/website to build and publish a preview of this commit; that
  # repository owns the web deploy. Only on main, and only once the commit has
  # passed every check.
  #
  # WEBSITE_DISPATCH_TOKEN needs Contents: write on PinBench/website, which is
  # what the repository_dispatch API requires. Without it the job succeeds with
  # a notice rather than failing every run.
  notify-website:
    name: Request web preview
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [analyze, test, package, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::notice::WEBSITE_DISPATCH_TOKEN is not set; no preview requested."
            exit 0
          fi
          gh api repos/PinBench/website/dispatches \
            -f event_type=app-updated \
            -f "client_payload[ref]=${GITHUB_SHA}"
