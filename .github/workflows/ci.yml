name: CI

on:
  push:
    branches: [main]
    # Tags still run the analysis and the test suite: a release is cut from a
    # tag, and this is the gate it goes through. The binaries themselves are
    # release.yml's job.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least privilege by default. GITHUB_TOKEN is handed to every action in the
# run, including third-party ones, so it should carry no more than reading the
# checkout. Jobs that need more opt in for themselves.
permissions:
  contents: read

env:
  # Single source of truth — this was pinned separately in three jobs, which is
  # how the removed --web-renderer flag survived the 3.44 upgrade in some steps
  # and not others.
  FLUTTER_VERSION: 3.44.4

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # packages/* are submodules in the published repository.
          submodules: recursive

      # No GTK/clang/ninja here on purpose: this job only analyzes and runs
      # unit tests, which execute on the Dart VM and compile nothing native.
      # The desktop toolchain belongs to build-desktop.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated *.g.dart files are git-ignored, so regenerate them before
      # analysis/tests (riverpod_generator, etc.).
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # `dart analyze --fatal-infos`, not `flutter analyze`.
      #
      # The grep below was added because a lint suite that silently stops
      # running is worse than one that was never configured — the green check
      # says it is working. It was guarding the right thing and missing the
      # bigger instance of it: `flutter analyze` does not load the analyzer
      # plugins `analysis_options.yaml` registers *at all*, so every
      # riverpod_lint rule was inert here, and 34 findings accumulated behind
      # this green step. They were only ever visible in an IDE.
      #
      # `--fatal-infos` because the two commands disagree on what failure
      # means: `flutter analyze` exits non-zero on an info, plain
      # `dart analyze` exits 0. Most of what riverpod_lint reports is
      # info-level, so without the flag this step would have got weaker.
      #
      # The grep stays as redundancy rather than the only defence: an
      # unresolvable plugin now exits 4 on its own, where `flutter analyze`
      # exited 0 with "No issues found". Verified by pinning riverpod_lint to a
      # nonexistent version — the message it greps for is still the one
      # printed.
      - name: Analyze
        run: |
          set -o pipefail
          dart analyze --fatal-infos 2>&1 | tee analyze.log
          if grep -q "error occurred while executing an analyzer plugin" analyze.log; then
            echo "::error::An analyzer plugin failed to load — see the log above."
            exit 1
          fi

      # Check only files tracked in git. `lib/ test/` would also cover the
      # *.g.dart / *.freezed.dart regenerated by the step above — those are
      # git-ignored build output, and build_runner does not emit them at the
      # page_width:100 this project uses, so including them fails CI over files
      # that are not even in the repository.
      - name: Check formatting
        run: git ls-files -z -- 'lib/*.dart' 'test/*.dart' | xargs -0 dart format --output=none --set-exit-if-changed

      # The 'arduino' tag covers tests that shell out to a local arduino-cli
      # toolchain, which isn't available on CI — they run locally instead.
      - name: Run tests
        run: flutter test --exclude-tags arduino --coverage

      # The root analysis_options excludes packages/**, and `flutter test` at
      # the root does not descend into them either — so until this step existed
      # nothing in packages/ was ever analyzed or run on CI. pinbench_pro's tests had
      # never executed here at all.
      #
      # Each package carries its own analysis_options and pubspec, so they are
      # checked on their own terms rather than the app's. Looping keeps a new
      # package covered the day it is added instead of the day someone
      # remembers to edit this file.
      - name: Analyze and test each package
        run: |
          set -euo pipefail
          for pkg in packages/*/; do
            [ -f "$pkg/pubspec.yaml" ] || continue
            echo "::group::$pkg"
            (
              cd "$pkg"
              flutter pub get
              dart analyze --fatal-infos
              # Not every package is a library with a suite — composite_plugin
              # is a generated analyzer plugin. `flutter test` exits 1 on "Test
              # directory not found", which is not a failure worth blocking on.
              # Announced either way, so a package that lost its tests shows up
              # rather than quietly passing.
              if [ -d test ]; then
                flutter test
              else
                echo "no test/ directory — analysis only"
              fi
            )
            echo "::endgroup::"
          done

      # Nice to have, never a reason to fail the gate. A full artifact
      # storage quota once turned a run with clean analysis and 431 passing
      # tests into a red X, which reads as "the code is broken" and is not
      # what this job is for.
      - name: Upload coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          # Artifacts default to 90 days, and desktop/web bundles at ~50 MB a
          # push filled the account's storage quota — which fails the upload
          # step of every workflow, including a release. These exist to hand
          # a build to a later job in the same run, plus a short window to
          # download one by hand; a week covers both.
          retention-days: 7

  # A malformed workflow fails the run in 0s with no usable error in the API —
  # `shell: ${{ matrix.shell }}` (expressions are not allowed there) cost a
  # push to discover. actionlint catches that class of mistake in ~2s.
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          # Pinned, like every other tool version here. `latest` meant a
          # release of actionlint could turn this job red on a push that
          # changed nothing — 1.7.12 added a shellcheck rule and did exactly
          # that. Bump deliberately, and fix what the new version finds in
          # the same commit. Was: latest
          bash <(curl -sS https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12 .
          ./actionlint -color

  # Proves the web target still compiles. Only proves it: this repository does
  # not publish the web app anywhere, so nothing here needs a deploy
  # configuration or its secrets.
  build-web:
    name: Build Web
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # packages/* are submodules in the published repository.
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # --wasm because that is the configuration that ships; a dart2js-only
      # build would miss a WASM-specific compile failure.
      - name: Build (WASM)
        run: flutter build web --wasm --pwa-strategy=none

  # Whether this push/PR touches code only a desktop toolchain compiles.
  #
  # `analyze-and-test` runs on the Dart VM and `build-web` runs dart2js, so
  # neither one ever compiles the native runners. Without this, a typo in
  # win32_window.cpp or my_application.cc stays invisible until a release tag
  # — which is the one build you least want to discover it in.
  #
  # Written as a git diff rather than a paths-filter action: it is a dozen
  # lines, and the alternative is another third-party action holding the
  # workflow token.
  detect-native-changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A new branch or a force-push leaves no usable base. Build rather
          # than guess: a wasted run is cheaper than an unverified runner.
          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit — building desktop to be safe."
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          # Indent the listing for readability. A read loop rather than
          # `sed 's/^/  /'`: shellcheck's SC2001 flags spawning sed for what
          # the shell does itself, and actionlint runs shellcheck over this.
          while IFS= read -r file; do
            [ -n "$file" ] && echo "  $file"
          done <<< "$changed"
          if echo "$changed" | grep -qE '^(macos|windows|linux)/'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  # Desktop binaries are release deliverables, not something consumed per
  # commit, and they cost ~30 min of runner time a push (Windows alone is
  # ~16 min). So this job exists for exactly one reason: to compile any commit
  # that edits a native runner, which is the only code no other job compiles.
  # Native code changes a couple of times a year, so that stays close to free.
  #
  # It deliberately does *not* run on version tags any more. Tags are handled
  # by release.yml, which builds the same three platforms and then signs,
  # notarises and packages them — running both would mean paying for the
  # desktop matrix twice and shipping the unsigned copy as a CI artifact
  # beside the signed one.
  build-desktop:
    name: Build ${{ matrix.target }}
    needs: [analyze-and-test, detect-native-changes]
    if: needs.detect-native-changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            target: macOS
            archive: tar -czf pinbench_macos.tar.gz -C build/macos/Build/Products/Release pinbench.app
          - os: windows-latest
            platform: windows
            target: Windows
            archive: powershell -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'pinbench_windows.zip'"
          - os: ubuntu-latest
            platform: linux
            target: Linux
            archive: tar -czf pinbench_linux.tar.gz -C build/linux/x64/release/bundle .

    steps:
      - uses: actions/checkout@v7
        with:
          # packages/* are submodules in the published repository.
          submodules: recursive

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # webkit 4.1 + soup3 are for desktop_webview_window — release.yml's
          # Linux leg carries the explanation.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libblkid-dev libasound2-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Desktop Platform
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Desktop App
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
        run: flutter build ${{ matrix.platform }} --release

      # One step instead of four `if:`-guarded ones. Every matrix leg used to
      # carry all four, and GitHub renders skipped steps, so each job listed
      # three packaging steps belonging to other platforms. `shell:` cannot
      # take an expression, so it stays bash — present on all three runners —
      # and the matrix carries the whole command. Windows shells out to
      # PowerShell so its artifact stays a .zip rather than a tarball.
      - name: Package
        shell: bash
        run: ${{ matrix.archive }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinbench-${{ matrix.platform }}
          path: pinbench_${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 7

  # Asks PinBench/website to build and publish a preview of this commit; that
  # repository owns the web deploy. Only on main, and only once the web build
  # above has proven the commit compiles.
  #
  # WEBSITE_DISPATCH_TOKEN needs Contents: write on PinBench/website, which is
  # what the repository_dispatch API requires. Without it the job succeeds with
  # a notice rather than failing every run.
  notify-website:
    name: Request web preview
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [analyze-and-test, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::notice::WEBSITE_DISPATCH_TOKEN is not set; no preview requested."
            exit 0
          fi
          gh api repos/PinBench/website/dispatches \
            -f event_type=app-updated \
            -f "client_payload[ref]=${GITHUB_SHA}"
