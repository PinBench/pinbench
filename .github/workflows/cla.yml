name: CLA

# Asks each contributor, on their first pull request, to sign the CLA
# (CLA.md) by commenting the sentence the bot gives them. Signatures are kept
# in this repository's cla-signatures branch and cover every later pull request.
#
# pull_request_target, so it can comment on pull requests from forks. It is
# safe here because nothing from the pull request is checked out or run: the
# action only reads comments and writes the signature file.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/PinBench/pinbench/blob/main/CLA.md
          branch: cla-signatures
          allowlist: burhankhanzada,dependabot[bot],*[bot]
