name: Template firmware

# The web app runs an untouched example's bundled <name>.ino.hex instead of
# compiling it, so each one must be the build of its sketch. This compiles
# every template and compares, whenever a template, the check or this file
# changes. Rebuild one with `dart tools/check_template_firmware.dart --write`.
on:
  pull_request:
    paths:
      - assets/templates/**
      - tools/check_template_firmware.dart
      - .github/workflows/template-firmware.yml
  push:
    branches: [main]
    paths:
      - assets/templates/**
      - tools/check_template_firmware.dart
      - .github/workflows/template-firmware.yml
  # Weekly too, for the service-toolchain job: the service can change
  # without anything here changing.
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The compile service's toolchain, pinned (its source of truth is
# PinBench/compile-service deploy/toolchain.env): a build only reproduces with
# the same versions. The service-toolchain job checks these against what the
# live service reports. When the service moves to newer ones, bump these to
# match and rebuild the templates with --write in the same pull request.
env:
  ARDUINO_CLI_VERSION: 1.5.1
  ARDUINO_CORES: arduino:avr@1.8.8 rp2040:rp2040@6.2.0
  ARDUINO_LIBRARIES: Adafruit SSD1306@2.5.17|Adafruit GFX Library@1.12.6|Adafruit BusIO@1.17.4|IRremote@4.7.1
  RP2040_INDEX: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json

jobs:
  # The live service's /health lists the versions it builds with; if they are
  # not these, the bundled firmware no longer matches what an edited sketch
  # compiles to, and this pinned set is out of date.
  service-toolchain:
    name: Pinned toolchain matches the compile service
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COMPILE_SERVICE: ${{ vars.COMPILE_API_URL || 'https://138-3-254-103.sslip.io' }}
    steps:
      - name: Compare with /health
        run: |
          health=$(curl -fsS --max-time 30 "$COMPILE_SERVICE/health")
          problems=0
          check() {  # what, pinned, live
            if [ "$2" = "$3" ]; then echo "ok    $1 $2"; else echo "DRIFT $1: pinned $2, the service has $3"; problems=1; fi
          }
          check arduino-cli "$ARDUINO_CLI_VERSION" "$(jq -r '.arduinoCliVersion' <<<"$health")"
          for core in $ARDUINO_CORES; do
            check "${core%@*}" "${core#*@}" "$(jq -r --arg k "${core%@*}" '.toolchain.cores[$k] // "nothing"' <<<"$health")"
          done
          IFS='|' read -ra libraries <<< "$ARDUINO_LIBRARIES"
          for lib in "${libraries[@]}"; do
            check "${lib%@*}" "${lib#*@}" "$(jq -r --arg k "${lib%@*}" '.toolchain.libraries[$k] // "nothing"' <<<"$health")"
          done
          exit "$problems"

  check:
    name: Templates match their firmware
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter (for Dart)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache the Arduino toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ env.ARDUINO_CLI_VERSION }}-${{ env.ARDUINO_CORES }}-${{ env.ARDUINO_LIBRARIES }}

      - name: Install arduino-cli, its cores and libraries
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/bin" sh -s "$ARDUINO_CLI_VERSION"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$RP2040_INDEX"
          arduino-cli core update-index
          # shellcheck disable=SC2086 # one word per core
          arduino-cli core install $ARDUINO_CORES
          # --no-deps: each dependency is pinned in the list itself.
          IFS='|' read -ra libraries <<< "$ARDUINO_LIBRARIES"
          arduino-cli lib install --no-deps "${libraries[@]}"
          arduino-cli core list
          arduino-cli lib list

      - name: Compile each template and compare its firmware
        run: dart tools/check_template_firmware.dart
