name: Feature request
description: Suggest something the app should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: |
        Describe the situation rather than the solution. "I'm teaching a class
        of 30 and can't tell who's finished" leads somewhere better than "add a
        dashboard".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds, other tools, or nothing at all.
    validations:
      required: false
