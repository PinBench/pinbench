name: pinbench_sim
description: >-
  The Arduino + SPICE simulation engine for PinBench: the AVR
  emulator bridge, the analog solver, the netlist, and the per-frame loop that
  drives placed parts. No canvas, no Riverpod, no host devices.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  # Not on pub.dev yet; pinned to the same commit as the app's pubspec.yaml.
  avr8_dart:
    git:
      url: https://github.com/PinBench/avr8_dart.git
      ref: 70f44156fbe8ae509313e1c0aace0b0efa079d01
  collection: ^1.19.1
  flutter:
    sdk: flutter
  # Local pure-Dart port (no FFI / libngspice). API-compatible Ngspice facade.
  ngspice_dart:
    git:
      url: https://github.com/PinBench/ngspice_dart.git
      # Pinned to a commit, not a branch — see the app's pubspec.yaml.
      ref: e17529d2dfac03624e20a618a60328636025991c
  pinbench_parts:
    path: ../pinbench_parts
  # Part definitions and the behaviour evaluator a `.pdl` part runs on.
  pinbench_pdl:
    git:
      url: https://github.com/PinBench/pdl.git
      ref: main

dev_dependencies:
  all_lints: ^0.1.2
  flutter_test:
    sdk: flutter
