name: pinbench_terminal
description: >-
  The embedded shell terminal for PinBench: an xterm view, the
  controller that owns a PTY process behind it, and the platform split that
  keeps the web preview honest about not having one.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  # Spawning a shell. Native only; there is no web implementation, which is
  # what `pty/pty_service_web.dart` exists to say out loud.
  flutter_pty: ^0.4.2
  # Two providers, written by hand rather than generated, so this package
  # needs no build_runner step — see terminal_controller.dart.
  flutter_riverpod: ^3.4.2
  # The app's widget kit — the terminal view is a screen like any other and
  # draws with `AppIcons`/`context.appColors` rather than reaching for a
  # widget library.
  pinbench_ui:
    path: ../pinbench_ui
  # The terminal emulator itself: parsing, scrollback, the widget.
  xterm: ^4.0.0

dev_dependencies:
  # The same lint preset the app uses — see analysis_options.yaml.
  all_lints: ^0.1.2
  flutter_test:
    sdk: flutter
