<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 38" width="76" height="38">
  <!-- Leads, drawn to the lattice points the .pdl declares as pins. -->
  <line x1="4" y1="20" x2="22" y2="20" stroke="#9aa0a6" stroke-width="3"/>
  <line x1="54" y1="20" x2="72" y2="20" stroke="#9aa0a6" stroke-width="3"/>
  <!-- Ceramic disc body. -->
  <circle cx="38" cy="20" r="16" fill="#f2e6c9" stroke="#b9a97a" stroke-width="1.5"/>
  <!-- The cadmium-sulphide serpentine that gives an LDR its look. -->
  <path d="M26 12 h24 M26 16 h24 M26 20 h24 M26 24 h24 M26 28 h24"
        stroke="#6d5a2f" stroke-width="1.6" fill="none"/>
  <path d="M50 12 v4 M26 16 v4 M50 20 v4 M26 24 v4"
        stroke="#6d5a2f" stroke-width="1.6" fill="none"/>
</svg>
