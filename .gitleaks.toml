# Secret scanning for this repository: `gitleaks dir .` (or `gitleaks git .`).
# The default rules, minus the few findings that are not secrets.
title = "PinBench"

[extend]
useDefault = true

[[allowlists]]
description = "Lockfiles: package checksums and hashes, not credentials."
paths = ['''(^|/)[^/]+\.lock$''']
